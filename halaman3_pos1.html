<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postingan Video - JustPaste</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            color: #333;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        /* Container Video Otomatis Menyesuaikan Ukuran */
        .video-container {
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container iframe {
            width: 100%;
            /* Menggunakan aspect-ratio 9:16 untuk video vertikal (Reels/TikTok) */
            aspect-ratio: 9 / 16;
            max-height: 75vh;
            border: none;
            display: block;
        }
        /* Kotak Peringatan Warna Kuning */
        .alert-box {
            background-color: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: 10px 12px;
            font-size: 13px;
            color: #856404;
            margin-bottom: 12px;
            border-radius: 4px;
            line-height: 1.4;
        }
        /* Tombol Download (Hijau) */
        .btn-download {
            display: block;
            background-color: #28a745;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        /* Tombol Alternatif (Oranye) */
        .btn-alt {
            display: block;
            background-color: #fd7e14;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn-alt:hover {
            background-color: #e8690b;
        }
        /* Footer */
        .footer {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pemutar Video Videy -->
        <div class="video-container">
            <iframe src="https://videy.co/v/?id=Kcv21Z6A1" allowfullscreen></iframe>
        </div>

        <!-- Kotak Peringatan -->
        <div class="alert-box">
            ⚠️ <b>Video tidak dapat diputar?</b> Silakan klik tombol <b>Download</b> atau <b>Link Alternatif</b> di bawah.
        </div>

        <!-- Tombol Action -->
        <a href="https://note2s.im/notes/RW6004" class="btn-download">⬇ DOWNLOAD VIDEO</a>
        <a href="#" class="btn-alt">🔗 Alternatif</a>

        <!-- Footer -->
        <div class="footer">
            &copy; Justpasteit &bull; Powered by GitHub Pages
        </div>
    </div>

</body>
</html>
