<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judul Postingan - JustPaste</title>
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .video-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        .video-container iframe {
            width: 100%;
            height: 320px;
            border: none;
            display: block;
        }
        .alert-box {
            background-color: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            font-size: 13px;
            color: #856404;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .btn-download {
            display: block;
            background-color: #28a745;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .btn-alt {
            display: block;
            background-color: #fd7e14;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn-alt:hover {
            background-color: #e8690b;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pemutar Video Videy dengan mode Fullscreen -->
        <div class="video-container">
            <iframe src="https://videy.co/v/?id=Kcv21Z6A1" allowfullscreen></iframe>
        </div>

        <!-- Kotak Peringatan / Informasi -->
        <div class="alert-box">
            ⚠️ Video tidak dapat diputar? Silakan klik tombol <b>Download</b> atau <b>Link Alternatif</b> di bawah.
        </div>

        <!-- Tombol Download -->
        <a href="https://note2s.im/notes/RW6004" class="btn-download">⬇ DOWNLOAD VIDEO</a>

        <!-- Tombol Alternatif -->
        <a href="#" class="btn-alt">🔗 Alternatif</a>

        <!-- Footer -->
        <div class="footer">
            &copy; Justpasteit &bull; Powered by GitHub Pages
        </div>
    </div>

</body>
</html>
